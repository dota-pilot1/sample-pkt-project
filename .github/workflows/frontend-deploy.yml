name: Deploy frontend

on:
  workflow_run:
    workflows:
      - Deploy backend
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: prac-pkt-react

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prac-pkt-react/package-lock.json

      - name: Configure production API URL
        run: printf '%s\n' 'VITE_API_BASE_URL=https://api.hibot-docu.com/api' > .env.production

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: |
          npm run lint
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static files to S3
        run: aws s3 sync dist/ "s3://${{ secrets.FRONTEND_S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'

      - name: Verify website
        run: curl --fail --silent --show-error --max-time 20 https://hibot-docu.com
