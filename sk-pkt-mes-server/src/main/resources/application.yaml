server:
  port: 4201

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hibot-docu.com,http://localhost:4200,http://localhost:4300,http://localhost:4301,tauri://localhost,http://tauri.localhost}
  playbook:
    # 로컬 학습 노트용 API는 기본 공개한다. 운영 환경에서는 반드시 false로 덮어쓴다.
    llm-api-public: ${PLAYBOOK_LLM_API_PUBLIC:true}

spring:
  application:
    name: sk-pkt-mes-server

  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5454/sk_pkt_mes}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

jwt:
  secret: ${JWT_SECRET:sk-pkt-mes-dev-secret-key-must-be-at-least-32-bytes-long}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 604800000
  issuer: sk-pkt-mes

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    bucket: ${AWS_S3_BUCKET_NAME:}
    region: ${AWS_S3_REGION:ap-northeast-2}
    prefix: ${AWS_S3_PREFIX:sk-pkt-mes}
    presign-expires-seconds: 300
