services:
  postgres:
    image: postgres:15-alpine
    container_name: sk-pkt-mes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sk_pkt_mes
    ports:
      - "5454:5432"
    volumes:
      - sk_pkt_mes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sk_pkt_mes_postgres_data:
    driver: local
